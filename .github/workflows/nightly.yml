name: Nightly Build

# Runs every day at midnight UTC — always provides a fresh downloadable APK
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  nightly:
    name: Nightly Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" --channel=0
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare nightly APK
        id: prepare
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          DATE=$(date +%Y%m%d)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          NEW_NAME="AndroidTerminal-nightly-${DATE}-${COMMIT_SHORT}.apk"
          cp "$APK_PATH" "app/build/outputs/apk/debug/${NEW_NAME}"
          echo "apk_name=${NEW_NAME}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      # Upload as artifact (downloadable for 30 days)
      - name: Upload Nightly APK
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ steps.prepare.outputs.date }}
          path: app/build/outputs/apk/debug/AndroidTerminal-nightly-*.apk
          retention-days: 30

      # Update the "nightly" pre-release (rolling latest)
      - name: Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build (${{ steps.prepare.outputs.date }})"
          body: |
            ## Nightly Build — ${{ steps.prepare.outputs.date }}

            Automatically built from the latest `master` branch.

            **Commit:** `${{ github.sha }}`
            **Date:** ${{ steps.prepare.outputs.date }}

            > This is an unstable development build. For stable releases, see the [Releases](../../releases) page.

            ### Download
            Download the APK below and install on your Android device.
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/AndroidTerminal-nightly-*.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
