name: Release APK

# Triggers: when a version tag is pushed (e.g., v1.0.0, v1.2.3)
on:
  push:
    tags:
      - 'v*'
  # Allow manual trigger with version input
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      # --- Build Debug APK (always works without signing) ---
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename Debug APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          VERSION="${{ steps.version.outputs.version }}"
          cp "$APK_PATH" "app/build/outputs/apk/debug/AndroidTerminal-v${VERSION}-debug.apk"

      # --- Build Release APK ---
      # If KEYSTORE_BASE64 secret is set, build signed; otherwise unsigned
      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
          echo "KEYSTORE_EXISTS=true" >> $GITHUB_ENV

      - name: Build Signed Release APK
        if: env.KEYSTORE_EXISTS == 'true'
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          RELEASE_STORE_FILE: release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Unsigned Release APK
        if: env.KEYSTORE_EXISTS != 'true'
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename Release APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$KEYSTORE_EXISTS" = "true" ]; then
            cp "$APK_PATH" "app/build/outputs/apk/release/AndroidTerminal-v${VERSION}-release.apk"
          else
            cp "$APK_PATH" "app/build/outputs/apk/release/AndroidTerminal-v${VERSION}-release-unsigned.apk"
          fi

      # --- Generate Changelog ---
      - name: Generate Changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$(git tag --sort=-version:refname | head -1)" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" -20)
          fi

          # Write to file for the release body
          cat > CHANGELOG.md << 'HEADER'
          ## What's New

          HEADER
          echo "$CHANGES" >> CHANGELOG.md

          cat >> CHANGELOG.md << 'FOOTER'

          ## Installation

          1. Download the APK file below
          2. On your Android device, enable **Install from Unknown Sources** in Settings
          3. Open the downloaded APK to install
          4. Launch **Android Terminal** from your app drawer

          ## First Launch

          - The app opens with a basic Android shell
          - To install a full Linux distro: tap the **menu** → **Linux Distributions** → select your distro
          - After installation, you can run `apt install <package>` to install any Linux package

          ## Supported Architectures

          | ABI | Devices |
          |-----|---------|
          | `arm64-v8a` | Most modern phones (2016+) |
          | `armeabi-v7a` | Older 32-bit ARM phones |
          | `x86_64` | Chromebooks, emulators |
          | `x86` | Older Intel tablets |
          FOOTER

      # --- Create GitHub Release ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.version) || github.ref_name }}
          name: "Android Terminal v${{ steps.version.outputs.version }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'rc') }}
          files: |
            app/build/outputs/apk/debug/AndroidTerminal-*.apk
            app/build/outputs/apk/release/AndroidTerminal-*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Upload artifacts as backup ---
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-v${{ steps.version.outputs.version }}
          path: |
            app/build/outputs/apk/debug/AndroidTerminal-*.apk
            app/build/outputs/apk/release/AndroidTerminal-*.apk
          retention-days: 90

      # --- Clean up keystore ---
      - name: Clean up keystore
        if: always()
        run: rm -f app/release-keystore.jks
